name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t itsm-ad-provisioning:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 -e WEBHOOK_TOKEN=ci itsm-ad-provisioning:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs -X POST localhost:8000/webhook/create-user \
            -H 'Content-Type: application/json' -H 'X-Webhook-Token: ci' \
            --data @examples/sample_ticket.json | tee /dev/stderr | grep -q '"succeeded":2'
